[project]
name = "signal-reducers"
version = "0.1.0a1"
requires-python = ">=3.14,<3.15"
description = "A bounded signal reduction prototype with local routing and hosted decisions"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<0.29",
    "redis>=6,<8",
    "laya==0.4.3",
]

[project.scripts]
signal-reducers = "signal_reducers.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "twine>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.py[cod]"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/signal_reducers"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src/signal_reducers",
    "/tests",
    "/scripts",
    "/docs",
    "/.github",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.gitignore",
    "/.env.example",
    "/config.example.toml",
    "/README.md",
    "/RUNNING.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
