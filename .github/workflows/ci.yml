name: Offline release checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ""
      OPENROUTER_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify supported runner
        run: |
          python -c 'import platform; assert platform.system() == "Darwin" and platform.machine() == "arm64"'
      - name: Install locked tooling and Redis
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.21
          brew list --formula redis >/dev/null 2>&1 || brew install redis
          command -v redis-server
          uv sync --locked
      - name: Lint and format
        env:
          UV_OFFLINE: "1"
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Run offline conformance tests
        env:
          UV_OFFLINE: "1"
        run: |
          uv run --locked pytest -q -ra --junitxml=outputs/ci-tests.xml
          uv run --locked python - <<'PY'
          from xml.etree import ElementTree
          report = ElementTree.parse("outputs/ci-tests.xml")
          skipped = sum(int(suite.get("skipped", 0)) for suite in report.findall(".//testsuite"))
          assert skipped == 0, f"Required conformance tests skipped: {skipped}"
          PY
      - name: Build and validate distributions
        env:
          UV_OFFLINE: "1"
        run: |
          uv build --no-build-isolation
          uv run --locked twine check --strict dist/*
          uv run --locked python scripts/validate_release.py dist
